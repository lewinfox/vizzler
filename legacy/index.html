<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width,initial-scale=1,viewport-fit=cover"
        />
        <title>swirly · disco</title>
        <style>
            html,
            body {
                margin: 0;
                height: 100%;
                background: #000;
                overflow: hidden;
                font-family: ui-monospace, Menlo, monospace;
                color: #eee;
            }
            canvas {
                position: fixed;
                inset: 0;
                width: 100vw;
                height: 100vh;
                display: block;
            }
            #ui {
                position: fixed;
                left: 12px;
                bottom: 10px;
                font-size: 11px;
                opacity: 0.6;
                pointer-events: none;
                text-shadow: 0 1px 2px rgba(0, 0, 0, 0.85);
                letter-spacing: 0.04em;
            }
            #dash {
                position: fixed;
                left: 12px;
                bottom: 32px;
                width: 360px;
                height: 84px;
                opacity: 0.7;
                pointer-events: none;
                image-rendering: pixelated;
            }
            #ui span {
                display: inline-block;
                min-width: 2.4em;
            }
            #ui #rg {
                min-width: auto;
                color: #ffd166;
                font-weight: 600;
                letter-spacing: 0.12em;
            }
            #ui #nv {
                min-width: 3em;
            }
            #start {
                position: fixed;
                inset: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                background: radial-gradient(
                    ellipse at center,
                    #1a0d24 0%,
                    #000 70%
                );
                cursor: pointer;
                transition: opacity 0.6s ease;
                z-index: 10;
            }
            #start.hidden {
                opacity: 0;
                pointer-events: none;
            }
            #start .card {
                text-align: center;
                padding: 28px 36px;
                border: 1px solid #5a2b6a;
                border-radius: 14px;
                background: rgba(40, 16, 56, 0.55);
                backdrop-filter: blur(8px);
                box-shadow: 0 0 60px rgba(255, 90, 200, 0.18) inset;
            }
            #start h1 {
                margin: 0 0 6px;
                font-size: 24px;
                font-weight: 500;
                letter-spacing: 0.16em;
                background: linear-gradient(
                    90deg,
                    #ff63c8,
                    #ffd166,
                    #6cf,
                    #ff63c8
                );
                -webkit-background-clip: text;
                background-clip: text;
                color: transparent;
            }
            #start p {
                margin: 0;
                font-size: 12px;
                opacity: 0.75;
            }
            #start .hint {
                margin-top: 14px;
                font-size: 11px;
                opacity: 0.5;
            }
        </style>
    </head>
    <body>
        <canvas id="c"></canvas>
        <canvas id="dash" width="720" height="168"></canvas>
        <div id="ui">
            <span id="rg">DISCO FLOOR</span> · live
            <span id="liv">0.00</span> · bass <span id="bv">0.00</span> mid
            <span id="mv">0.00</span> hi <span id="hv">0.00</span> · beat
            <span id="bts">0.00</span> · tens <span id="tns">0.00</span> · whi
            <span id="whi">0.00</span> · nov <span id="nv">0.00</span>
        </div>
        <div id="start">
            <div class="card">
                <h1>~ DISCO ~</h1>
                <p>click to enter · grants microphone</p>
                <div class="hint">no mic? still a party.</div>
            </div>
        </div>

        <!-- dev-only live reload: polls Last-Modified on localhost, reloads on change. -->
        <script>
            (() => {
                if (
                    location.hostname !== "localhost" &&
                    location.hostname !== "127.0.0.1"
                )
                    return;
                let lastMod = null;
                setInterval(async () => {
                    try {
                        const r = await fetch(location.pathname, {
                            method: "HEAD",
                            cache: "no-store",
                        });
                        const m = r.headers.get("last-modified");
                        if (lastMod && m && m !== lastMod) location.reload();
                        if (m) lastMod = m;
                    } catch {}
                }, 800);
            })();
        </script>

        <script>
            "use strict";

            // ═══════════════════════════════════════════════════════════════
            // SWIRLY · DISCO  — single-file WebGL2 + Web Audio reactive viz
            //
            // SIGNAL FLOW (audio → pixels):
            //
            //   mic → AnalyserNode   → freq bytes → bands(bass/mid/hi)
            //                                          ↓ auto-gain
            //   mic → AudioWorklet   → IIR bandpass → flux → onset events
            //                            (audio-block rate, ~3ms latency)
            //                                          ↓
            //   liveness gate (absolute volume sigmoid) — calms everything
            //   when the room is silent
            //                                          ↓
            //   feature bus (volume / fullness / centroid / onsetDensity / flux)
            //     each channel = { short EMA, long EMA, autoscaled deviation }
            //                                          ↓
            //   tension accumulator: charges from positive deviations,
            //   drains when whiteout fires
            //                                          ↓
            //   derived uniforms:
            //     uBrightness  — sigmoid of (absVol ↔ volN by liveness)
            //     uEnergy      — same + tension boost
            //     uWhiteout    — 4-way AND-gated (vol/full/loud/tension)
            //     uBeatPresence — smoothed onset density
            //   regime params (segOff/twist/warp/rings/sparkle/rays/hue)
            //   palette crossfade (two IQ palettes lerped by palMix)
            //                                          ↓
            //   fragment shader:
            //     kaleidoscope fold + vortex twist + Lissajous-drifted
            //     domain-warped fbm + concentric rings + sunburst rays
            //     (FFT-driven) + disco-ball twinkles + per-channel
            //     sigmoid tonemap
            //
            // ALL TWEAKABLE KNOBS are in the TWEAKABLE PARAMETERS section
            // immediately below. Anything else (formula constants, shader
            // baselines) is intentionally inline.
            // ═══════════════════════════════════════════════════════════════

            const canvas = document.getElementById("c");
            const gl = canvas.getContext("webgl2", {
                antialias: false,
                alpha: false,
                premultipliedAlpha: false,
            });
            if (!gl) {
                document.body.innerHTML =
                    "<p style='padding:20px'>WebGL2 unavailable.</p>";
                throw new Error("no webgl2");
            }

            // ═══════════════════════════════════════════════════════════════
            // TWEAKABLE PARAMETERS
            //
            // Every knob that meaningfully affects the FEEL of the viz lives
            // here. Change a value, save, and live-reload picks it up.
            //
            // Each block has a short note on what it does, units, and a sane
            // range. If you only tweak one thing, it should usually be one of:
            //   - F_LONG_RATE              (how reactive everything is)
            //   - SILENCE_FLOOR / MUSIC_THRESHOLD  (when the room "wakes up")
            //   - WHITEOUT_*_GATE          (how rare whiteouts are)
            //   - NOVELTY_THRESHOLD        (how often regimes switch)
            //   - PALETTES, REGIMES        (the actual content)
            //
            // Knobs that live in the SHADER (not here) include the IQ palette
            // formulae, fbm noise scales, kaleidoscope fold math, ring/warp
            // baselines, vignette shape, and tonemap exposure (currently 0.95).
            // Look in the FS template-literal source string for those.
            // ═══════════════════════════════════════════════════════════════

            // ---- Spectrum texture ----
            // 1-row R8 texture sent to the shader for the sunburst rays.
            // Drives angular resolution. 32 = chunky, 64 = balanced (current),
            // 128 = silky but more bandwidth + noisier-looking rays.
            const SPEC_N = 64;

            // ---- Audio band envelopes (per-frame followers) ----
            // Used in follow(prev, target, attack, release) on the auto-gained
            // bands. Per-frame multipliers, NOT dt-corrected, so behavior shifts
            // a bit between 30Hz / 120Hz. Higher = snappier; lower = gloopier.
            const ATTACK_SOFT  = 0.08;   // attack on bass/mid/vol — viscous
            const ATTACK_MED   = 0.14;   // attack on hi — slightly snappier
            const RELEASE_OOZE = 0.012;  // very slow release on bass/vol (lava-lamp)
            const RELEASE_SLOW = 0.025;  // medium release on mid/hi

            // ---- Auto-gain (per-band running max normalizer) ----
            // Each band is divided by its running peak so quiet songs still
            // feel reactive. Peak decays at GAIN_DECAY per frame.
            const GAIN_DECAY = 0.9985;   // 0.9985 ≈ 7s peak memory at 60fps.
                                         // Lower (0.998 ≈ 3.5s) = more pumping.

            // ---- Onset envelope decay ----
            // Worklet posts onsets → onset[band] is set to strength → decays
            // here for shader use as uOnBass/uOnMid/uOnHi. Higher = faster fade.
            const ONSET_DECAY = { bass: 2.2, mid: 2.6, hi: 3.2 };

            // ---- Bouncy bass spring (uBounce) ----
            // Underdamped spring impulsed by bass onsets via handleOnsetMessage.
            // Natural freq ω₀ = √K (Hz / 2π); damping ratio ζ = D / (2√K).
            // K=90 → 1.5 Hz oscillation. ζ ≈ 0.34 → ~3 cycles before settle (~2s).
            // Higher K = faster bounce. Higher D = quicker settle, fewer wobbles.
            const BOUNCE_K = 90;
            const BOUNCE_D = 6.5;

            // ---- Feature bus EMAs ----
            // Each channel (volume, fullness, centroid, onsetDensity, flux)
            // tracks short EMA, long EMA, running |dev| for autoscale.
            // dev = (short - long) / max(absDev*1.5, 0.04), clamped -1..+1.
            //
            // F_LONG_RATE is the most consequential knob. Defines "this song's
            // recent character." Sane range: 0.05..0.20 (settle ~20s..5s).
            //   - Lower (0.05) → bigger devs, more reactive, more whiteouts
            //   - Higher (0.20) → calmer, slower-feeling, fewer regime switches
            //   - Don't push past 0.30 — long catches up so fast that devs
            //     vanish and the system stops reacting altogether.
            const F_SHORT_RATE  = 2.5;   // 1/s — short EMA settle ~0.4s
            const F_LONG_RATE   = 0.05;  // 1/s — long EMA settle ~20s
            const F_ABSDEV_RATE = 0.30;  // 1/s — autoscale window ~3s

            // ---- Tension accumulator ----
            // Charges from positive devs (gated by liveness), decays slowly.
            // Drives whiteout intensity + biases regime picker toward energetic
            // regimes. Whiteout firing drains it (see WHITEOUT_DRAIN_RATE).
            const TENSION_GAIN  = 0.22;  // how fast positive devs charge tension
            const TENSION_DECAY = 0.20;  // 1/s — ~5s decay timeconstant when idle
            const TENSION_MAX   = 2.0;   // hard cap (so a long crescendo doesn't pin)

            // ---- Liveness gate (master "is anything actually playing") ----
            // smoothstep(SILENCE_FLOOR, MUSIC_THRESHOLD, absVolSmooth) → 0..1.
            // Multiplies the entire reactive layer (bands, tension, novelty,
            // onsets) so a silent room sees a calm idle and music ramps in.
            // Asymmetric attack/release so brief silences don't strobe.
            const LIVE_ATT_RATE   = 1.5;  // 1/s — ~0.7s come-on when music starts
            const LIVE_REL_RATE   = 0.33; // 1/s — ~3s fall-off
            const SILENCE_FLOOR   = 0.04; // absVol below this = silent room
            const MUSIC_THRESHOLD = 0.20; // absVol above this = definitely music

            // ---- Whiteout gates (4-way AND, drains tension on fire) ----
            // gateOpen = product of four smoothstep gates over (vol.dev,
            // fullness.dev, vol.short, tension). All four must clear for any
            // whitening. Aim: 0–2 fires per song. Raise the lo bounds to make
            // whiteout rarer; lower to make easier. WHITEOUT_MAX caps the JS
            // value; the shader caps the on-screen mix at 0.55 separately.
            // Gates tightened (~50% less propensity to fire). Each lo-bound bumped
            // up by ~0.07 and tension floor raised from 1.2 → 1.45. Because gateOpen
            // is the *product* of four smoothstep gates, the cumulative effect is
            // much larger than any single tightening — fires roughly halve in
            // frequency. WHITEOUT_MAX also halved so on-screen intensity is gentler.
            const WHITEOUT_VOL_GATE     = [0.82, 1.00]; // smoothstep over feat.volume.dev
            const WHITEOUT_FULL_GATE    = [0.78, 1.00]; // smoothstep over feat.fullness.dev
            const WHITEOUT_LOUD_GATE    = [0.62, 0.92]; // smoothstep over feat.volume.short (absolute loud)
            const WHITEOUT_TENSION_GATE = [1.45, 2.00]; // smoothstep over tension
            const WHITEOUT_MAX          = 0.32;
            const WHITEOUT_DRAIN_RATE   = 1.6;          // 1/s — how fast firing drains tension
            const WHITEOUT_ATTACK_RATE  = 6.0;          // 1/s — fast snap-up on fire
            const WHITEOUT_RELEASE_RATE = 0.9;          // 1/s — slow release after fire

            // ---- Brightness / energy sigmoid ----
            // brightnessSrc = mix(absVolSmooth, volN, liveness) — silent room
            // collapses to absolute volume; music sigmoids on auto-gained val.
            // brightness = FLOOR + RANGE × smoothstep(SIG_LO, SIG_HI, src)
            // The same sigmoid drives energy with its own floor/range + an
            // optional tension boost so buildups feel slightly more excited.
            const BRIGHT_FLOOR         = 0.12;
            const BRIGHT_RANGE         = 0.66;
            const BRIGHT_SIG           = [0.04, 0.55];
            const BRIGHT_FOLLOW_RATE   = 2.5;  // 1/s — how fast brightness reacts
            const ENERGY_FLOOR         = 0.18;
            const ENERGY_RANGE         = 0.62;
            const ENERGY_TENSION_BOOST = 0.10;
            const ENERGY_MAX           = 1.05; // safety clamp

            // ---- Beat presence (smoothed onset density) ----
            // smoothstep(LO, HI, onsetDensity.short) → 0..1. Gates the BASELINE
            // intensity of glints + ring activity in the shader. Units: onsets
            // per second. Below LO the room feels rhythm-less; above HI it's
            // clearly grooving.
            const BEAT_PRESENCE_RANGE  = [0.6, 2.6];
            const BEAT_FOLLOW_RATE     = 1.2; // 1/s — how fast beat presence reacts

            // ---- Regimes & palette swaps ----
            const PAL_SWAP_DURATION    = 1.6;   // s — palette crossfade time on switch
            const REGIME_COOLDOWN_MS   = 5000;  // min ms between regime switches (hard floor)
            // Novelty trigger uses a TWO-STAGE filter:
            //
            //  1. Per-channel emphasis: emphasis() returns 0 for |dev| ≤ NOVELTY_FLOOR
            //     so steady autoscale fluctuation from a single channel contributes
            //     nothing. Only genuinely-excursive devs make it through.
            //
            //  2. "Boil" integrator on the aggregate:
            //         drive = max(0, instantNovelty - NOVELTY_BOIL)
            //         sustained += (drive·HEAT_RATE - sustained·COOL_RATE) · dt
            //     Below NOVELTY_BOIL, drive is 0 and sustained decays to zero —
            //     it CAN'T climb on steady-state input no matter how long. Above
            //     NOVELTY_BOIL, it climbs toward (drive·HEAT/COOL). Big drops
            //     (instant ~3+) reach threshold in ~1s; moderate ~2s changes in
            //     2-3s; normal music (instant 0..1) never climbs at all.
            //
            // Switch fires when sustained > NOVELTY_THRESHOLD AND cooldown elapsed.
            const NOVELTY_FLOOR         = 0.65; // per-channel: |dev| below this counts as steady noise
            const NOVELTY_BOIL          = 1.00; // aggregate: instant novelty below this can't charge sustained
            const NOVELTY_HEAT_RATE     = 0.30; // 1/s — how fast sustained climbs above boil
            const NOVELTY_COOL_RATE     = 0.40; // 1/s — how fast sustained decays
            const NOVELTY_THRESHOLD     = 0.85; // sustained novelty needed to switch
            const NOVELTY_MAX           = 3.0;  // hard cap on sustained value
            const REGIME_CROSSFADE_RATE = 1.1;  // 1/s — exp approach of regime params
            const SWITCH_FLASH_DECAY    = 1.5;  // 1/s — decay of post-switch white kick

            // ---- Misc timings ----
            const SEGMENTS_DRIFT_MS    = 22000; // ms between random base segment-count rerolls

            // ═══════════════════════════════════════════════════════════════
            // END TWEAKABLE PARAMETERS
            // ═══════════════════════════════════════════════════════════════

            const VS = `#version 300 es
in vec2 a;
void main(){ gl_Position = vec4(a, 0.0, 1.0); }`;

            const FS = `#version 300 es
precision highp float;
out vec4 o;

uniform vec2  uRes;
uniform float uTime;

// smoothed (viscous) bands
uniform float uBass, uMid, uHi;
// raw bands — fast localized accents
uniform float uBassRaw, uMidRaw, uHiRaw;
// onset tails
uniform float uOnBass, uOnMid, uOnHi;
// spring-driven bouncy bass
uniform float uBounce;
// spectral centroid 0..1
uniform float uCentroid;
// phases / segments
uniform float uSlow, uBeat, uSegments;

// two palettes crossfaded by uPalMix
uniform vec3 uPalA[4];
uniform vec3 uPalB[4];
uniform float uPalMix;

// frequency → color *rotation*. Per-regime random weights for how each band
// shifts the palette around the wheel. Spatial noise still owns the dominant
// term in ci so the field has texture; these just rotate the color theme.
uniform vec4  uColMap;       // (centroid, bass, mid, hi) palette-rotation weights
uniform float uColBase;      // per-regime baseline offset (sets the "color zone")

// regime coefficients — these crossfade slowly when the scene changes
uniform float uRegSegOff;     // added to kaleidoscope base
uniform float uRegTwist;      // twist amount multiplier
uniform float uRegWarp;       // warp amount multiplier
uniform float uRegRings;      // ring strength multiplier
uniform float uRegSparkle;    // disco-ball twinkle multiplier
uniform float uRegRays;       // sunburst ray multiplier
uniform float uRegHue;        // additional hue rotation (added to ci)

// switch flash — snaps to 1 the instant we change regime, decays fast.
// boosts energy/glow to make the regime change felt as a "BOOP".
uniform float uSwitchFlash;

// derived "macro state" — all computed in JS from the feature bus.
// brightness: global multiplier — sigmoid of absolute volume. ~0.12 when silent,
//   ~0.45 default party loudness, ~0.75 peak. Saturates softly, never reaches 1.
// energy: drives glow/vignette/saturation. similar to brightness but with a small
//   tension boost so sustained novelty feels mildly more excited.
// whiteout: gated mix toward white. Only nonzero on REAL big drops (vol+fullness
//   excursion AND accumulated tension to spend).
// beatPresence: smoothed onset density 0..1. Gates baseline glints/ring activity
//   so a beat-less section is calm and a beat-driven section is engaged.
uniform float uBrightness;
uniform float uEnergy;
uniform float uWhiteout;
uniform float uBeatPresence;

// 1-row R8 texture, SPEC_N pixels, auto-gained
uniform sampler2D uSpectrum;

#define TAU 6.28318530718
#define PI  3.14159265359

float hash(vec2 p){ p = fract(p*vec2(123.34, 456.21)); p += dot(p, p+45.32); return fract(p.x*p.y); }
float vnoise(vec2 p){
  vec2 i = floor(p), f = fract(p);
  vec2 u = f*f*(3.0-2.0*f);
  return mix(mix(hash(i), hash(i+vec2(1,0)), u.x),
             mix(hash(i+vec2(0,1)), hash(i+vec2(1,1)), u.x), u.y);
}
float fbm(vec2 p){
  float s = 0.0, a = 0.5;
  mat2 r = mat2(0.8, -0.6, 0.6, 0.8);
  for (int i = 0; i < 6; i++){
    s += a * vnoise(p);
    p = r * p * 2.02;
    a *= 0.5;
  }
  return s;
}

vec3 palOne(float t, vec3 a, vec3 b, vec3 c, vec3 d){
  return a + b * cos(TAU * (c*t + d));
}
vec3 pal(float t){
  vec3 ca = palOne(t, uPalA[0], uPalA[1], uPalA[2], uPalA[3]);
  vec3 cb = palOne(t, uPalB[0], uPalB[1], uPalB[2], uPalB[3]);
  return mix(ca, cb, uPalMix);
}

mat2 rot(float a){ float s = sin(a), c = cos(a); return mat2(c, -s, s, c); }

vec2 kaleido(vec2 p, float n){
  float r = length(p);
  float a = atan(p.y, p.x);
  float seg = TAU / n;
  a = mod(a, seg);
  a = abs(a - seg * 0.5);
  return vec2(cos(a), sin(a)) * r;
}

void main(){
  vec2 frag = (gl_FragCoord.xy - 0.5*uRes) / min(uRes.x, uRes.y);

  // pulse: gentle zoom centered on energy. Bouncy spring + switch flash on top.
  float pulse = 0.88 + 0.30 * uEnergy + 0.10 * uBounce + 0.18 * uSwitchFlash;
  vec2 p = frag / pulse;

  float twist = (uSlow * 0.035 + 0.22 * sin(uSlow * 0.27) * (1.0 - exp(-2.2 * length(p)))) * uRegTwist;
  p = rot(twist) * p;

  float seg = max(3.0, uSegments + uRegSegOff + floor(uMid * 5.0 + uOnMid * 2.0));
  p = kaleido(p, seg);

  float t = uTime * 0.035 + uSlow * 0.10;
  vec2 drift = 0.55 * vec2(sin(uSlow * 0.27), cos(uSlow * 0.19));
  drift += 0.45 * vec2(uHi - uBass, uMid - 0.5*(uBass+uHi));

  vec2 q = vec2(
    fbm(p * 1.6 + drift + vec2(0.0, t)),
    fbm(p * 1.6 + drift + vec2(5.2, -t))
  );
  vec2 r = vec2(
    fbm(p * 2.7 + 4.0*q + vec2(1.7 + t*0.7, 9.2)),
    fbm(p * 2.7 + 4.0*q + vec2(8.3, 2.8 - t*0.7))
  );
  float warpAmt = (0.7 + 1.0*uMid + 0.55*uBass + 0.35*uOnMid) * uRegWarp;
  float n = fbm(p * 2.2 + warpAmt * r + 0.16 * uHi * sin(p.yx * 14.0 + uTime*0.7));

  float rad = length(p);
  // ring intensity fades when there's no beat — beatless sections stay smooth
  float ringMod = mix(0.4, 1.0, uBeatPresence);
  float rings = sin(rad * (5.5 + 6.0*uBass + 3.0*uOnMid) - uTime*0.28) * uRegRings * ringMod;
  n = mix(n, n + 0.20*rings, 0.4);

  // ---- color index ----
  // Spatial terms DOMINATE so the field always has texture and color gradients
  // across the frame (no flashing-in-unison). Audio terms add a smaller rotation
  // around the palette wheel — randomized per regime for variety. The palette
  // params themselves crossfade on regime swap, so two layers of color identity:
  // (1) which palette is active, (2) which slice of it the music tunes us into.
  float ci = n
    + 0.18 * length(q)
    + uColBase
    + 0.30 * uCentroid * uColMap.x
    + 0.15 * uBass * uColMap.y
    + 0.15 * uMid  * uColMap.z
    + 0.15 * uHi   * uColMap.w
    + 0.005 * uTime
    + uBeat * 0.05
    + uRegHue * 0.4;
  vec3 col = pal(ci);

  // saturation push driven by energy — subtle, plus a kick during switches
  float lum = dot(col, vec3(0.299, 0.587, 0.114));
  col = mix(vec3(lum), col, 1.0 + 0.45 * uEnergy + 0.25 * uSwitchFlash);

  col = mix(col, col*col*1.8, clamp(uBass*0.45, 0.0, 0.40));

  // localized fast patches (raw bands)
  float ridgeMask  = smoothstep(0.58, 0.86, n);
  col += ridgeMask * uHiRaw * pal(ci + 0.42) * 0.55;
  float troughMask = smoothstep(0.42, 0.12, n);
  col += troughMask * uBassRaw * pal(ci - 0.18) * 0.40;
  float edgeMask   = 1.0 - smoothstep(0.0, 0.18, abs(n - 0.5));
  col += edgeMask * uMidRaw * pal(ci + 0.7) * 0.25;

  // sunburst rays from spectrum (regime-scaled)
  float ang = atan(p.y, p.x);
  float su  = (ang + PI) / TAU;
  float rayA = texture(uSpectrum, vec2(su,         0.5)).r;
  float rayB = texture(uSpectrum, vec2(su + 0.003, 0.5)).r;
  float ray  = max(rayA, rayB);
  float rays = ray * exp(-1.3 * rad) * (0.35 + 0.70 * uEnergy) * uRegRays;
  col += rays * pal(ci + 0.55) * 0.42;

  // disco-ball twinkles (regime-scaled)
  vec2 gp = p * 13.0 + vec2(uSlow*0.4, -uSlow*0.3);
  vec2 cell = floor(gp);
  float seedA = hash(cell);
  float seedB = hash(cell + 17.31);
  float gate = step(0.94, seedA);
  float twinklePhase = seedB * TAU + uTime * (1.2 + 3.0 * seedA);

    const ch = input[0];
    const N = ch.length;
    let sB = 0, sM = 0, sH = 0;
    const fb = this.bp.bass, fm = this.bp.mid, fh = this.bp.hi;
    for (let i = 0; i < N; i++) {
      const s = ch[i];
      const b = fb.step(s), m = fm.step(s), h = fh.step(s);
      sB += b*b; sM += m*m; sH += h*h;

    const eM = Math.sqrt(sM / N);
    const eH = Math.sqrt(sH / N);

    this.energyAvg.mid  = this.energyAvg.mid  * 0.92 + eM * 0.08;
    this.energyAvg.hi   = this.energyAvg.hi   * 0.92 + eH * 0.08;

    const flB = Math.max(0, eB - this.lastE.bass);
    const flM = Math.max(0, eM - this.lastE.mid);
    const flH = Math.max(0, eH - this.lastE.hi);

    this.fluxAvg.bass = this.fluxAvg.bass * 0.93 + flB * 0.07;

    this.fluxAvg.hi   = this.fluxAvg.hi   * 0.93 + flH * 0.07;

    if (this.refr.mid  > 0) this.refr.mid  -= N;
    if (this.refr.hi   > 0) this.refr.hi   -= N;

    fire('mid',  flM, eM);
    fire('hi',   flH, eH);

  }

            const regimeTarget = { ...REGIMES[regimeIdx].p };
            // REGIME_COOLDOWN_MS / NOVELTY_THRESHOLD live in PARAMS
            let lastRegimeSwitchAt = -100000;
            // smoothed novelty — what actually triggers regime switches.
            // Integrated at NOVELTY_SUSTAIN_RATE so brief spikes don't fire.
            let sustainedNovelty = 0;

            // ---------- console diagnostics ----------
            // Boot banner: dump every tweakable param + every regime + every palette.
            // Helpful when you're tuning by feel and want to see what's currently active.
            function logBoot() {
                const title = "color: #ff63c8; font-weight: bold; font-size: 13px;";
                const dim = "color: #888; font-style: italic;";
                const head = "color: #6cf; font-weight: bold;";
                console.log("%cswirly · disco", title);
                console.log(
                    "%cmic-reactive viz · open the groups below to see all knobs",
                    dim,
                );

                console.groupCollapsed("%c⚙  tweakable params", head);
                console.table({
                    SPEC_N,
                    ATTACK_SOFT, ATTACK_MED,
                    RELEASE_OOZE, RELEASE_SLOW,
                    GAIN_DECAY,
                    BOUNCE_K, BOUNCE_D,
                    F_SHORT_RATE, F_LONG_RATE, F_ABSDEV_RATE,
                    TENSION_GAIN, TENSION_DECAY, TENSION_MAX,
                    LIVE_ATT_RATE, LIVE_REL_RATE,
                    SILENCE_FLOOR, MUSIC_THRESHOLD,
                    WHITEOUT_MAX, WHITEOUT_DRAIN_RATE,
                    WHITEOUT_ATTACK_RATE, WHITEOUT_RELEASE_RATE,
                    BRIGHT_FLOOR, BRIGHT_RANGE, BRIGHT_FOLLOW_RATE,
                    ENERGY_FLOOR, ENERGY_RANGE,
                    ENERGY_TENSION_BOOST, ENERGY_MAX,
                    BEAT_FOLLOW_RATE,
                    PAL_SWAP_DURATION, REGIME_COOLDOWN_MS,
                    NOVELTY_FLOOR, NOVELTY_BOIL,
                    NOVELTY_HEAT_RATE, NOVELTY_COOL_RATE,
                    NOVELTY_THRESHOLD, NOVELTY_MAX,
                    REGIME_CROSSFADE_RATE,
                    SWITCH_FLASH_DECAY, SEGMENTS_DRIFT_MS,
                });
                console.log("Range params (smoothstep [lo, hi]):", {
                    WHITEOUT_VOL_GATE,
                    WHITEOUT_FULL_GATE,
                    WHITEOUT_LOUD_GATE,
                    WHITEOUT_TENSION_GATE,
                    BRIGHT_SIG,
                    BEAT_PRESENCE_RANGE,
                });
                console.log("ONSET_DECAY (per-band tail decay rate, 1/s):", ONSET_DECAY);
                console.groupEnd();

                console.groupCollapsed(
                    `%c🎨 regimes (${REGIMES.length})`,
                    "color: #ffd166; font-weight: bold;",
                );
                console.table(
                    REGIMES.map((r, i) => ({
                        idx: i,
                        name: r.name,
                        ...r.p,
                        palettes: r.palettes.join(","),
                    })),
                );
                console.groupEnd();

                const PALETTE_NAMES = [
                    "hot pink / cyan",
                    "gold / magenta / lime",
                    "electric blue / yellow",
                    "tangerine / cherry / cream",
                    "mint / coral / lilac",
                    "hot magenta / orange",
                ];
                console.groupCollapsed(
                    `%c🌈 palettes (${PALETTES.length})  · IQ cosine: a + b·cos(2π·(c·t + d))`,
                    "color: #6f6; font-weight: bold;",
                );
                PALETTES.forEach((p, i) => {
                    console.log(
                        `[${i}] ${PALETTE_NAMES[i] || ""}`,
                        "\n  a:", p[0],
                        "\n  b:", p[1],
                        "\n  c:", p[2],
                        "\n  d:", p[3],
                    );
                });
                console.groupEnd();

                console.log(
                    "%c→ regime switches and whiteout fires logged below as they happen",
                    dim,
                );
            }
            logBoot();

            let switchFlash = 0; // decays after each switch

            // novelty across the feature bus — weighted sum of *emphasized* |dev|s.
            // emphasis() returns 0 below NOVELTY_FLOOR so steady-state autoscale
            // fluctuation doesn't contribute. Real character changes (multiple
            // channels excursive) drive this up; brief single-channel spikes don't.
            function noveltyNow() {
                return (
                    1.6 * emphasis(feat.volume.dev) +
                    1.4 * emphasis(feat.fullness.dev) +
                    1.6 * emphasis(feat.flux.dev) +
                    1.0 * emphasis(feat.centroid.dev) +
                    0.8 * emphasis(feat.onsetDensity.dev)
                );
            }

            // regime picker with thermodynamic bias. high tension + high positive vol/flux dev
            // = "system is hot" → favor energetic regimes. Low energy → favor chill regimes.
            // The chill regimes act as ground states the system naturally decays into.
            // Returns { idx, scores, heat } so the caller can log the decision.
            function pickNextRegime() {
                const heat =
                    tension * 0.5 +
                    Math.max(0, feat.volume.dev) * 0.7 +
                    Math.max(0, feat.flux.dev) * 0.7 +
                    Math.max(0, feat.fullness.dev) * 0.4;
                const scores = REGIMES.map((r, i) => {
                    if (i === regimeIdx) return -1;
                    let s = Math.random() * 0.4;
                    const isChill =
                        r.name === "AURORA" || r.name === "LAVA LAMP";
                    const isHot =
                        r.name === "VORTEX" || r.name === "DISCO FLOOR";
                    const isSparkly = r.name === "MIRROR BALL";
                    if (isChill) s += 1.4 - heat * 1.6;
                    if (isHot) s += 0.4 + heat * 1.0;
                    if (isSparkly)
                        s += 0.6 + 0.8 * Math.max(0, feat.centroid.dev);
                    if (r.name === "VORTEX")
                        s += 0.8 * Math.max(0, feat.volume.short - 0.3);
                    if (r.name === "AURORA")
                        s += 0.6 * Math.max(0, feat.centroid.short - 0.4);
                    if (r.name === "LAVA LAMP")
                        s += 0.8 * Math.max(0, 0.4 - feat.volume.short);
                    return s;
                });
                let best = 0,
                    bestScore = -Infinity;
                for (let i = 0; i < scores.length; i++)
                    if (scores[i] > bestScore) {
                        bestScore = scores[i];
                        best = i;
                    }
                return { idx: best, scores, heat };
            }

            function switchRegime(now) {
                const prevName = REGIMES[regimeIdx].name;
                const { idx: next, scores, heat } = pickNextRegime();
                const novInstant = noveltyNow() * liveness;

                // log the decision in a collapsible group so the console stays scannable
                console.groupCollapsed(
                    `%c⚡ regime: ${prevName} → ${REGIMES[next].name}`,
                    "color: #ffd166; font-weight: bold;",
                );
                const drive = Math.max(0, novInstant - NOVELTY_BOIL);
                console.log(
                    `sustained: ${sustainedNovelty.toFixed(3)}  (threshold ${NOVELTY_THRESHOLD})  ·  instant: ${novInstant.toFixed(2)}  ·  drive: ${drive.toFixed(2)}  (boil ${NOVELTY_BOIL})`,
                );
                console.log(
                    `liveness: ${liveness.toFixed(2)}   tension: ${tension.toFixed(2)}   heat: ${heat.toFixed(2)}`,
                );
                console.log("dev snapshot (short - long, normalized to ±1):", {
                    volume: +feat.volume.dev.toFixed(2),
                    fullness: +feat.fullness.dev.toFixed(2),
                    flux: +feat.flux.dev.toFixed(2),
                    centroid: +feat.centroid.dev.toFixed(2),
                    onsetDensity: +feat.onsetDensity.dev.toFixed(2),
                });
                console.table(
                    REGIMES.map((r, i) => ({
                        regime: r.name,
                        score:
                            scores[i] === -1
                                ? "(current)"
                                : +scores[i].toFixed(3),
                        picked: i === next ? "★" : "",
                    })),
                );
                console.groupEnd();

                regimeIdx = next;
                Object.assign(regimeTarget, REGIMES[next].p);
                lastRegimeSwitchAt = now;
                switchFlash = 1.0; // BOOP
                const choices = REGIMES[next].palettes.filter(
                    (i) => i !== palCurIdx,
                );
                const pick = choices.length
                    ? choices[(Math.random() * choices.length) | 0]
                    : REGIMES[next].palettes[0];
                swapPaletteTo(pick);
                randomizeColorMap();
                rgEl.textContent = REGIMES[next].name;
            }

            // ---------- spectrum texture ----------
            let specMax = 1;
            function updateSpectrum() {
                if (!freq) {
                    specBytes.fill(0);
                } else {
                    const N = freq.length;
                    let frameMax = 0;
                    for (let i = 0; i < SPEC_N; i++) {
                        const t0 = i / SPEC_N,
                            t1 = (i + 1) / SPEC_N;
                        const a = Math.floor(2 + Math.pow(t0, 1.7) * (N - 4));
                        const b = Math.max(
                            a + 1,
                            Math.floor(2 + Math.pow(t1, 1.7) * (N - 4)),
                        );
                        let m = 0;
                        for (let j = a; j < b; j++)
                            if (freq[j] > m) m = freq[j];
                        specBytes[i] = m;
                        if (m > frameMax) frameMax = m;
                    }
                    specMax = Math.max(specMax * 0.995, frameMax, 32);
                    const scale = 255 / specMax;
                    for (let i = 0; i < SPEC_N; i++) {
                        const v = specBytes[i] * scale;
                        specBytes[i] = v > 255 ? 255 : v | 0;
                    }
                }
                gl.activeTexture(gl.TEXTURE0);
                gl.bindTexture(gl.TEXTURE_2D, specTex);
                gl.texSubImage2D(
                    gl.TEXTURE_2D,
                    0,
                    0,
                    0,
                    SPEC_N,
                    1,
                    gl.RED,
                    gl.UNSIGNED_BYTE,
                    specBytes,
                );
            }

            function computeCentroid() {
                if (!freq) return 0.5;
                let num = 0,
                    denom = 0;
                const N = freq.length;
                const invLogN = 1 / Math.log2(N);
                for (let i = 2; i < N; i++) {
                    const v = freq[i];
                    num += v * Math.log2(i + 1) * invLogN;
                    denom += v;
                }
                return denom > 1 ? num / denom : 0.5;
            }

            const bv = document.getElementById("bv");
            const mv = document.getElementById("mv");
            const hv = document.getElementById("hv");
            const nv = document.getElementById("nv");
            const btsEl = document.getElementById("bts");
            const tnsEl = document.getElementById("tns");
            const whiEl = document.getElementById("whi");
            const livEl = document.getElementById("liv");
            const rgEl = document.getElementById("rg");
            // sync HUD label with the random initial regimeIdx picked above
            rgEl.textContent = REGIMES[regimeIdx].name;

            // ---------- diagnostic dashboard (wireframe time-series + regime bar) ----------
            // Three mini line graphs of the most useful real-time signals, plus a
            // "regime change closeness" bar that reads novelty × cooldown progress.
            // The closeness bar reaches 100% the moment the system is allowed to
            // switch — useful for seeing how the system "decides" to change regime.
            const dashCanvas = document.getElementById("dash");
            const dx = dashCanvas.getContext("2d");
            dx.scale(2, 2); // backing store is 2× CSS for crisp lines on retina
            const DASH_W = 360,
                DASH_H = 84;
            const HIST_LEN = 240; // ~4s at 60fps
            const hist = {
                bass: new Float32Array(HIST_LEN),
                mid: new Float32Array(HIST_LEN),
                hi: new Float32Array(HIST_LEN),
                liveness: new Float32Array(HIST_LEN),
                tension: new Float32Array(HIST_LEN),
                novelty: new Float32Array(HIST_LEN),
                whiteout: new Float32Array(HIST_LEN),
            };
            let histPtr = 0;

            function pushHist(snapshot) {
                histPtr = (histPtr + 1) % HIST_LEN;
                hist.bass[histPtr]     = snapshot.bass;
                hist.mid[histPtr]      = snapshot.mid;
                hist.hi[histPtr]       = snapshot.hi;
                hist.liveness[histPtr] = snapshot.liveness;
                hist.tension[histPtr]  = snapshot.tension;
                hist.novelty[histPtr]  = snapshot.novelty;
                hist.whiteout[histPtr] = snapshot.whiteout;
            }

            function drawLine(buf, x, y, w, h, vMin, vMax, color) {
                dx.strokeStyle = color;
                dx.lineWidth = 1;
                dx.beginPath();
                const range = vMax - vMin || 1;
                for (let i = 0; i < HIST_LEN; i++) {
                    // walk oldest → newest so the line scrolls right-to-left
                    const idx = (histPtr + 1 + i) % HIST_LEN;
                    const t = (buf[idx] - vMin) / range;
                    const px = x + (i / (HIST_LEN - 1)) * w;
                    const py = y + h - Math.max(0, Math.min(1, t)) * h;
                    if (i === 0) dx.moveTo(px, py);
                    else dx.lineTo(px, py);
                }
                dx.stroke();
            }

            function drawPanel(x, y, w, h, title, lines) {
                // wireframe border + dim axis
                dx.strokeStyle = "rgba(255,255,255,0.18)";
                dx.lineWidth = 0.5;
                dx.strokeRect(x + 0.5, y + 0.5, w, h);
                // half-axis tick — shows midpoint of the panel's value range
                dx.strokeStyle = "rgba(255,255,255,0.06)";
                dx.beginPath();
                dx.moveTo(x, y + h * 0.5);
                dx.lineTo(x + w, y + h * 0.5);
                dx.stroke();
                // each series
                for (const l of lines) drawLine(l.buf, x, y, w, h, l.min, l.max, l.color);
                // title + legend
                dx.font = "8px ui-monospace, Menlo, monospace";
                dx.fillStyle = "rgba(255,255,255,0.4)";
                dx.fillText(title, x + 3, y + 9);
                let lx = x + w - 3;
                for (let i = lines.length - 1; i >= 0; i--) {
                    const txt = lines[i].label;
                    dx.fillStyle = lines[i].color;
                    const tw = dx.measureText(txt).width;
                    dx.fillText(txt, lx - tw, y + 9);
                    lx -= tw + 6;
                }
            }

            function drawDash(now) {
                dx.clearRect(0, 0, DASH_W, DASH_H);
                const PAD = 4, GAP = 6;
                const panelW = (DASH_W - PAD * 2 - GAP * 2) / 3;
                const panelH = 44;
                const panelY = PAD;

                drawPanel(PAD, panelY, panelW, panelH, "bands", [
                    { buf: hist.bass, label: "bass", color: "#ff63c8", min: 0, max: 1 },
                    { buf: hist.mid,  label: "mid",  color: "#ffd166", min: 0, max: 1 },
                    { buf: hist.hi,   label: "hi",   color: "#6cf",    min: 0, max: 1 },
                ]);
                drawPanel(PAD + panelW + GAP, panelY, panelW, panelH, "state", [
                    { buf: hist.liveness, label: "live", color: "#6f6", min: 0, max: 1 },
                    { buf: hist.tension,  label: "tens", color: "#fff", min: 0, max: TENSION_MAX },
                ]);
                drawPanel(PAD + (panelW + GAP) * 2, panelY, panelW, panelH, "triggers", [
                    // novelty graph max = 2× threshold so the line has headroom when drives are big
                    { buf: hist.novelty,  label: "nov", color: "#ffd166",
                      min: 0, max: NOVELTY_THRESHOLD * 2 },
                    { buf: hist.whiteout, label: "whi", color: "#fff", min: 0, max: 1 },
                ]);

                // ---- regime closeness bar ----
                // closeness = cooldownProgress × noveltyRatio, both clamped 0..1.
                // hits 100% the moment a regime switch is allowed to fire.
                const cooldownProg = Math.min(
                    1,
                    (now - lastRegimeSwitchAt) / REGIME_COOLDOWN_MS,
                );
                const novRatio = Math.min(
                    1,
                    hist.novelty[histPtr] / NOVELTY_THRESHOLD,
                );
                const closeness = cooldownProg * novRatio;

                const barX = PAD + 56;
                const barY = panelY + panelH + 8;
                const barW = DASH_W - barX - PAD - 32;
                const barH = 10;
                dx.font = "9px ui-monospace, Menlo, monospace";
                dx.fillStyle = "rgba(255,255,255,0.55)";
                dx.fillText("regime →", PAD, barY + 8);
                // bar frame
                dx.strokeStyle = "rgba(255,255,255,0.20)";
                dx.lineWidth = 0.5;
                dx.strokeRect(barX + 0.5, barY + 0.5, barW, barH);
                // fill — color shifts toward hot as we approach 100%
                const fillW = Math.max(0, barW - 2) * closeness;
                dx.fillStyle =
                    closeness > 0.95
                        ? "#ffd166"
                        : closeness > 0.6
                          ? "rgba(255,209,102,0.6)"
                          : "rgba(108, 204, 255, 0.5)";
                dx.fillRect(barX + 1, barY + 1, fillW, barH - 2);
                // tick at the cooldown-elapsed point so you can see WHICH gate is the bottleneck
                if (cooldownProg < 1) {
                    dx.strokeStyle = "rgba(255,90,200,0.6)";
                    dx.beginPath();
                    dx.moveTo(barX + barW * cooldownProg, barY - 1);
                    dx.lineTo(barX + barW * cooldownProg, barY + barH + 1);
                    dx.stroke();
                }
                // numeric percent
                dx.fillStyle = "rgba(255,255,255,0.85)";
                const pctText = Math.round(closeness * 100) + "%";
                dx.fillText(pctText, barX + barW + 5, barY + 8);
            }

            const t0 = performance.now();
            let lastFrame = t0;

            function frame(now) {
                const t = (now - t0) / 1000;
                const dt = Math.min(0.05, (now - lastFrame) / 1000);
                lastFrame = now;

                let bass = 0,
                    mid = 0,
                    hi = 0;
                if (analyser) {
                    analyser.getByteFrequencyData(freq);
                    // bin width ≈ 94 Hz at fftSize=512/48kHz. recompute band ranges accordingly.
                    bass = band(1, 4); // ~94..375 Hz
                    mid = band(4, 25); // ~375..2344 Hz
                    hi = band(25, 90); // ~2344..8438 Hz
                }
                // liveness: track absolute volume (pre-shape, pre-auto-gain) with an
                // asymmetric follower — fast attack, slow release. Then sigmoid → 0..1.
                const absVolRaw = (bass + mid + hi) / 3;
                const liveK =
                    absVolRaw > absVolSmooth ? LIVE_ATT_RATE : LIVE_REL_RATE;
                absVolSmooth +=
                    (absVolRaw - absVolSmooth) * Math.min(1, dt * liveK);
                liveness = smoothstep01(
                    SILENCE_FLOOR,
                    MUSIC_THRESHOLD,
                    absVolSmooth,
                );

                // log live/silent transitions (with hysteresis so it can't flicker).
                // Initial state is "idle" so the very first transition gets logged once.
                if (liveness > 0.6 && _liveState !== "live") {
                    console.log(
                        "%c♪ room is LIVE",
                        "color: #6cf; font-weight: bold;",
                        `liveness ${liveness.toFixed(2)}, absVol ${absVolSmooth.toFixed(3)}`,
                    );
                    _liveState = "live";
                } else if (liveness < 0.2 && _liveState !== "silent") {
                    console.log(
                        "%c· room went silent",
                        "color: #888;",
                        `liveness ${liveness.toFixed(2)}, absVol ${absVolSmooth.toFixed(3)}`,
                    );
                    _liveState = "silent";
                }

                bass = Math.pow(bass, 0.85) * 1.3;

                const bassN = autoGain("bass", bass);
                const midN = autoGain("mid", mid);
                const hiN = autoGain("hi", hi);
                const volN = (bassN + midN + hiN) / 3;

                raw.bass = bassN;
                raw.mid = midN;
                raw.hi = hiN;

                env.bass = follow(env.bass, bassN, ATTACK_SOFT, RELEASE_OOZE);
                env.mid = follow(env.mid, midN, ATTACK_SOFT, RELEASE_SLOW);
                env.hi = follow(env.hi, hiN, ATTACK_MED, RELEASE_SLOW);
                env.vol = follow(env.vol, volN, ATTACK_SOFT, RELEASE_OOZE);

                // onset tails decay each frame (impulses into onset[] come from the worklet)
                for (const k of ["bass", "mid", "hi"]) {
                    onset[k] = Math.max(0, onset[k] * (1 - dt * ONSET_DECAY[k]));
                }

                // bouncy bass spring — impulses arrive from the worklet via handleOnsetMessage
                bounceV += -BOUNCE_K * bounceY * dt;
                bounceV *= Math.exp(-BOUNCE_D * dt);
                bounceY += bounceV * dt;

                beatPhase += dt * 0.05;
                beatPhaseSmooth +=
                    (beatPhase - beatPhaseSmooth) * Math.min(1, dt * 1.6);

                const centroidNow = computeCentroid();
                centroidSmooth +=
                    (centroidNow - centroidSmooth) * Math.min(1, dt * 1.2);

                // ---- feature bus update ----
                const fullnessRaw = Math.cbrt(Math.max(0, bassN * midN * hiN));
                updateChan(feat.volume, volN, dt);
                updateChan(feat.fullness, fullnessRaw, dt);
                updateChan(feat.centroid, centroidSmooth, dt);
                updateChan(feat.onsetDensity, onsetDensityNow(), dt);
                updateChan(feat.flux, spectralFluxNow(), dt);

                // ---- tension: charges from positive deviations, decays slowly ----
                // Drive is gated by liveness so noise can't accumulate tension in a
                // silent room; tension still decays normally → cools to zero.
                const tensionDrive =
                    (Math.max(0, feat.volume.dev) * 1.0 +
                        Math.max(0, feat.fullness.dev) * 1.2 +
                        Math.max(0, feat.flux.dev) * 1.5 +
                        Math.max(0, feat.onsetDensity.dev) * 0.6) *
                    liveness;
                tension +=
                    (tensionDrive * TENSION_GAIN - tension * TENSION_DECAY) *
                    dt;
                tension = Math.max(0, Math.min(TENSION_MAX, tension));

                // ---- whiteout: four-way gated, modulated by tension ----
                // All four gates must clear simultaneously for any whitening.
                // Values come from WHITEOUT_*_GATE in PARAMS — adjust there
                // to make whiteout easier or harder. Aim: 0–2 fires per song.
                const volExc = smoothstep01(
                    WHITEOUT_VOL_GATE[0],
                    WHITEOUT_VOL_GATE[1],
                    feat.volume.dev,
                );
                const fullExc = smoothstep01(
                    WHITEOUT_FULL_GATE[0],
                    WHITEOUT_FULL_GATE[1],
                    feat.fullness.dev,
                );
                const loudEnough = smoothstep01(
                    WHITEOUT_LOUD_GATE[0],
                    WHITEOUT_LOUD_GATE[1],
                    feat.volume.short,
                );
                const tensionEnough = smoothstep01(
                    WHITEOUT_TENSION_GATE[0],
                    WHITEOUT_TENSION_GATE[1],
                    tension,
                );
                const gateOpen = volExc * fullExc * loudEnough * tensionEnough;
                const whiteoutTarget = Math.min(WHITEOUT_MAX, gateOpen);
                const whiteoutRate =
                    whiteoutTarget > uWhiteoutVal
                        ? WHITEOUT_ATTACK_RATE
                        : WHITEOUT_RELEASE_RATE;
                uWhiteoutVal +=
                    (whiteoutTarget - uWhiteoutVal) *
                    Math.min(1, dt * whiteoutRate);
                // drain tension while firing so we can't sustain whiteout or re-fire soon
                if (uWhiteoutVal > 0.2)
                    tension = Math.max(
                        0,
                        tension - uWhiteoutVal * dt * WHITEOUT_DRAIN_RATE,
                    );

                // log a single line per whiteout event (rising-edge detection)
                if (uWhiteoutVal > 0.3 && !_whiteoutWasFiring) {
                    _whiteoutWasFiring = true;
                    console.log(
                        "%c⚡ WHITEOUT",
                        "color: #fff; background: #222; padding: 2px 8px; font-weight: bold; border-radius: 3px;",
                        {
                            target: +whiteoutTarget.toFixed(2),
                            gates: {
                                vol: +volExc.toFixed(2),
                                full: +fullExc.toFixed(2),
                                loud: +loudEnough.toFixed(2),
                                tension: +tensionEnough.toFixed(2),
                            },
                            tension: +tension.toFixed(2),
                            regime: REGIMES[regimeIdx].name,
                        },
                    );
                } else if (uWhiteoutVal < 0.05) {
                    _whiteoutWasFiring = false;
                }

                // ---- brightness / energy: crossfade source by liveness ----
                // At silence the sigmoid input is absolute volume → very dim.
                // With music it crossfades to the auto-gained volume so quiet
                // songs still light up properly. Constants in PARAMS.
                const brightnessSrc =
                    absVolSmooth + (volN - absVolSmooth) * liveness;
                const sigT = smoothstep01(
                    BRIGHT_SIG[0],
                    BRIGHT_SIG[1],
                    brightnessSrc,
                );
                const brightnessTarget = BRIGHT_FLOOR + BRIGHT_RANGE * sigT;
                uBrightnessVal +=
                    (brightnessTarget - uBrightnessVal) *
                    Math.min(1, dt * BRIGHT_FOLLOW_RATE);

                const energyTarget =
                    ENERGY_FLOOR +
                    ENERGY_RANGE * sigT +
                    ENERGY_TENSION_BOOST * Math.min(1, tension * 0.6);
                uEnergyVal +=
                    (energyTarget - uEnergyVal) *
                    Math.min(1, dt * BRIGHT_FOLLOW_RATE);
                uEnergyVal = Math.min(ENERGY_MAX, uEnergyVal);

                // ---- beat presence: smoothed onset density gating glints/rings ----
                // BEAT_PRESENCE_RANGE / BEAT_FOLLOW_RATE in PARAMS.
                const beatTarget = smoothstep01(
                    BEAT_PRESENCE_RANGE[0],
                    BEAT_PRESENCE_RANGE[1],
                    feat.onsetDensity.short,
                );
                uBeatPresenceVal +=
                    (beatTarget - uBeatPresenceVal) *
                    Math.min(1, dt * BEAT_FOLLOW_RATE);

                slowPhase += dt * (0.05 + env.vol * 0.18);

                if (now - segmentDriftAt > SEGMENTS_DRIFT_MS) {
                    segmentDriftAt = now;
                    segments = 4 + Math.floor(Math.random() * 6); // 4..9
                }

                // ---- regime switching (boil model) ----
                // Per-channel emphasis (NOVELTY_FLOOR) filters single-channel noise.
                // Aggregate "boil" integrator: drive = max(0, instant - BOIL).
                // sustained climbs only when drive > 0 (real multi-channel excursion),
                // decays otherwise. Steady music = drive 0 = sustained always 0.
                const novInstant = noveltyNow() * liveness;
                const drive = Math.max(0, novInstant - NOVELTY_BOIL);
                sustainedNovelty +=
                    (drive * NOVELTY_HEAT_RATE -
                        sustainedNovelty * NOVELTY_COOL_RATE) *
                    dt;
                sustainedNovelty = Math.max(
                    0,
                    Math.min(NOVELTY_MAX, sustainedNovelty),
                );
                const nov = sustainedNovelty;
                if (
                    nov > NOVELTY_THRESHOLD &&
                    now - lastRegimeSwitchAt > REGIME_COOLDOWN_MS
                ) {
                    switchRegime(now);
                    for (const k in feat) feat[k].short = feat[k].long;
                    sustainedNovelty = 0;
                }

                // crossfade regime params toward target — exponential approach.
                // REGIME_CROSSFADE_RATE in PARAMS controls how fast it settles.
                const regimeK = 1 - Math.exp(-dt * REGIME_CROSSFADE_RATE);
                for (const key of PARAM_KEYS) {
                    regimeCur[key] +=
                        (regimeTarget[key] - regimeCur[key]) * regimeK;
                }

                // switch flash decays (SWITCH_FLASH_DECAY in PARAMS)
                switchFlash = Math.max(
                    0,
                    switchFlash -
                        dt * SWITCH_FLASH_DECAY * Math.max(switchFlash, 0.3),
                );

                // palette crossfade — once mix completes, bake the target as the new current
                if (palMix < 1) {
                    palMix = Math.min(1, palMix + dt / PAL_SWAP_DURATION);
                    if (palMix === 1) {
                        palCurIdx = palNextIdx;
                        palCur = flatPal(palCurIdx);
                    }
                }

                updateSpectrum();

                bv.textContent = env.bass.toFixed(2);
                mv.textContent = env.mid.toFixed(2);
                hv.textContent = env.hi.toFixed(2);
                livEl.textContent = liveness.toFixed(2);
                btsEl.textContent = uBeatPresenceVal.toFixed(2);
                tnsEl.textContent = tension.toFixed(2);
                whiEl.textContent = uWhiteoutVal.toFixed(2);
                nv.textContent = nov.toFixed(2);

                // diagnostic dashboard — push current snapshot, redraw
                pushHist({
                    bass: env.bass,
                    mid: env.mid,
                    hi: env.hi,
                    liveness,
                    tension,
                    novelty: nov,
                    whiteout: uWhiteoutVal,
                });
                drawDash(now);

                gl.uniform2f(U.res, canvas.width, canvas.height);
                gl.uniform1f(U.time, t);
                // Band uniforms are pre-multiplied by liveness here. In silence they
                // upload as ~0 and the shader's audio-driven terms (warp, rings,
                // heartbeat, contrast pop, patches, color rotation) all go quiet —
                // leaving just the spatial pattern + slow drift. Onsets and bounce
                // are already gated at the source (handleOnsetMessage), so they
                // don't need extra scaling here.
                gl.uniform1f(U.bass, env.bass * liveness);
                gl.uniform1f(U.mid, env.mid * liveness);
                gl.uniform1f(U.hi, env.hi * liveness);
                gl.uniform1f(U.bassRaw, raw.bass * liveness);
                gl.uniform1f(U.midRaw, raw.mid * liveness);
                gl.uniform1f(U.hiRaw, raw.hi * liveness);
                gl.uniform1f(U.onBass, onset.bass);
                gl.uniform1f(U.onMid, onset.mid);
                gl.uniform1f(U.onHi, onset.hi);
                gl.uniform1f(U.bounce, bounceY);
                gl.uniform1f(U.centroid, centroidSmooth * liveness);
                gl.uniform1f(U.beat, beatPhaseSmooth);
                gl.uniform1f(U.slow, slowPhase);
                gl.uniform1f(U.seg, segments);
                gl.uniform3fv(U.palA, palCur);
                gl.uniform3fv(U.palB, palNext);
                gl.uniform1f(U.palMix, palMix);
                gl.uniform1f(U.regSegOff, regimeCur.segOff);
                gl.uniform1f(U.regTwist, regimeCur.twist);
                gl.uniform1f(U.regWarp, regimeCur.warp);
                gl.uniform1f(U.regRings, regimeCur.rings);
                gl.uniform1f(U.regSparkle, regimeCur.sparkle);
                gl.uniform1f(U.regRays, regimeCur.rays);
                gl.uniform1f(U.regHue, regimeCur.hue);
                gl.uniform1f(U.switchFlash, switchFlash);
                gl.uniform1f(U.brightness, uBrightnessVal);
                gl.uniform1f(U.energy, uEnergyVal);
                gl.uniform1f(U.whiteout, uWhiteoutVal);
                gl.uniform1f(U.beatPresence, uBeatPresenceVal);
                gl.uniform4f(U.colMap, colMap.x, colMap.y, colMap.z, colMap.w);
                gl.uniform1f(U.colBase, colBase);

                gl.drawArrays(gl.TRIANGLES, 0, 3);
                requestAnimationFrame(frame);
            }

            const startEl = document.getElementById("start");
            async function go() {
                startEl.classList.add("hidden");
                await startAudio();
                requestAnimationFrame(frame);
                setTimeout(() => {
                    if (startEl.parentNode) startEl.remove();
                }, 800);
            }
            startEl.addEventListener("click", go);
            addEventListener(
                "keydown",
                (e) => {
                    if (e.key === " " || e.key === "Enter") go();
                },
                { once: true },
            );

            // On reload, if the mic permission is already granted (live-reload, refresh, etc.),
            // skip the welcome card and jump straight back into the viz.
            // AudioContext may still be suspended without a user gesture — if so, attach a
            // one-shot listener that resumes it on the next interaction so audio reactivity
            // kicks in as soon as the user does anything.
            (async () => {
                if (!navigator.permissions || !navigator.permissions.query)
                    return;
                let perm;
                try {
                    perm = await navigator.permissions.query({
                        name: "microphone",
                    });
                } catch {
                    return;
                } // some browsers reject the 'microphone' name
                if (perm.state !== "granted") return;
                await go();
                if (audioCtx && audioCtx.state !== "running") {
                    const resumeOnce = () => audioCtx.resume();
                    addEventListener("pointerdown", resumeOnce, { once: true });
                    addEventListener("keydown", resumeOnce, { once: true });
                }
            })();
        </script>
    </body>
</html>
